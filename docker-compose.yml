services:
  backend:
    build: ./backend
    expose:
      - "8080"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_SOCKET_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
